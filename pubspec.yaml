name: naqel
description: "Naqel — backend/business-logic focused Flutter architecture."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Functional programming
  fpdart: ^1.2.0
  equatable: ^2.0.7

  # State management (session/business logic)
  flutter_bloc: ^9.1.1

  # Networking
  internet_connection_checker_plus: ^2.9.1+2
  dio: ^5.9.2

  # Backend – Firebase
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_database: ^12.1.4
  firebase_storage: ^13.1.0

  # Storage
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # Environment
  flutter_dotenv: ^6.0.0

  # Logging
  logger: ^2.6.2

  # Utilities
  path_provider: ^2.1.4
  geolocator: ^14.0.2
  permission_handler: ^12.0.1

  # Device & System
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
